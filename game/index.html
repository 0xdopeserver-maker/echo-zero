<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECHO//ZERO</title>
    <style>
      :root {
        --void: #07080b;
        --ink: #e8eef5;
        --dim: #6d7787;
        --cyan: #46e6ff;
        --red: #ff4d5e;
        --amber: #ffc857;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        font: 15px/1.45 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      body { display: grid; place-items: center; }
      #stage {
        position: relative;
        width: min(100vw, 177.78vh);
        height: min(100vh, 56.25vw);
        background: radial-gradient(120% 90% at 50% 0%, #0d1118 0%, #05060a 70%);
      }
      canvas { display: block; width: 100%; height: 100%; }
      #status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #boot-hint {
        position: absolute;
        left: 0; right: 0; bottom: 12px;
        text-align: center;
        color: var(--dim);
        font-size: 13px;
        letter-spacing: .16em;
        text-transform: uppercase;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="1280" height="720" aria-label="ECHO//ZERO playfield"></canvas>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="boot-hint">arrows / wasd move &nbsp;·&nbsp; e interact &nbsp;·&nbsp; r record &nbsp;·&nbsp; space echo &nbsp;·&nbsp; backspace reset</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
